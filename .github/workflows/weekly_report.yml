# Re-registered after initial-push indexing issue
name: Weekly Swing Report

on:
  schedule:
    # 07:00 UTC 금요일 = 16:00 KST 금요일
    - cron: '0 7 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python weekly_report.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated picks log
        run: |
          git config user.name "swing-screener-bot"
          git config user.email "actions@github.com"
          git add picks_log.csv
          git diff --cached --quiet || git commit -m "Mark picks reported $(date -u +%F)"
          git push
