# Re-registered after initial-push indexing issue
name: Weekly Research Retrospective

on:
  schedule:
    # 07:00 UTC Friday = 16:00 KST Friday
    - cron: '0 7 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrospective:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python research_agent.py --weekly-report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit weekly research report
        run: |
          git config user.name "stock-research-agent"
          git config user.email "actions@github.com"
          git add "agents/주식천재stock-research-agent/reports/weekly"
          git diff --cached --quiet || git commit -m "Add weekly research report $(date -u +%F)"
          git push
