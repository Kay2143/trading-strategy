# Re-registered after initial-push indexing issue
name: Daily Swing Screener

on:
  schedule:
    # 22:30 UTC = 07:30 KST, 일~목요일(UTC) = 월~금요일(KST)
    - cron: '30 22 * * 0,1,2,3,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python swing_screener.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: Commit updated picks log
        run: |
          git config user.name "swing-screener-bot"
          git config user.email "actions@github.com"
          git add picks_log.csv
          git diff --cached --quiet || git commit -m "Update picks log $(date -u +%F)"
          git push
