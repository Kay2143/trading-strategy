# Re-registered after initial-push indexing issue
name: Daily Stock Research Agent

on:
  schedule:
    # 23:00 UTC = 08:00 KST, 일~목요일(UTC) = 월~금요일(KST)
    - cron: '0 23 * * 0,1,2,3,4'
  workflow_dispatch:
    inputs:
      force:
        description: '오늘 이미 실행됐어도 재분석하고 다시 전송'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stock-research-agent
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python research_agent.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit research reports and outcome ledger
        run: |
          git config user.name "stock-research-agent"
          git config user.email "actions@github.com"
          git add "agents/주식천재stock-research-agent/reports" "agents/주식천재stock-research-agent/decisions/candidate_ledger.csv"
          git diff --cached --quiet || git commit -m "Add daily stock research $(date -u +%F)"
          git push
